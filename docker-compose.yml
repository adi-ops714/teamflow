services:
  db:
    image: postgres:16
    container_name: teamflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamflow
    ports:
      - "5432:5432"
    volumes:
      - teamflow_data:/var/lib/postgresql/data
volumes:
  teamflow_data:
